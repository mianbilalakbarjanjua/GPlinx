legal:{
terms:`## 1. What GPlinx is
GPlinx is an online marketplace where advertisers (buyers) order guest posts and links on websites owned by publishers. We provide the platform, hold payments in escrow and help resolve problems. We do not own the listed websites and we do not promise any ranking, traffic or search engine result.

## 2. Your account
You must be at least 18 years old and give true information. Keep your password safe: you are responsible for what happens in your account. Your username is created from your email and cannot be changed. We may suspend or close accounts that break these terms or put other users at risk.

## 3. Prices and fees
Publishers set their own prices in US dollars. The buyer pays the publisher's price plus a flat 20% service fee (and the extra price if the publisher writes the article). GPlinx takes no commission from publishers: the publisher receives the full listing price. A promo code can lower the buyer's service fee. We may change our fees; a change only applies to orders placed after it is announced.

## 4. Adding money to your wallet
You can add funds with the payment methods shown on the Add funds page (PayPal, USDT, Pakistani or international bank transfer, JazzCash, Easypaisa). Send the payment to the details shown there, enter the transaction or reference number, and upload a picture of your payment slip. The slip is required. Your wallet is credited after we confirm the payment. Always use the network shown for USDT: money sent on a different network or to a wrong address cannot be recovered. A transaction ID can be used only once. If a payment is reversed, cancelled or found to be fraudulent, we may remove the credit and suspend the account.

## 5. How an order works
When a buyer orders, the payment is held in escrow. The publisher accepts or rejects the order. If the publisher rejects it, or does not deliver in the promised time, the buyer gets a full refund to the wallet (or can choose to wait longer). The publisher publishes the article, which the buyer provides or the publisher writes, and sends the live link.

## 6. Improvements, review period and payment release
After delivery the buyer has 3 days to ask for improvements through the order messages. For 20 days the buyer can also report a removed link or an article that is not indexed by Google. The publisher must make sure the article is indexed within the 20 days. While a problem is open, the payment stays on hold; when the publisher fixes it, a new 20-day review period starts. If the buyer approves, or 20 days pass with no open problem, the publisher's payment is released automatically. Every order shows a live timer.

## 7. Publisher payouts
Publishers can withdraw their available balance (minimum $10) to the payout details saved in their settings (PayPal, USDT, bank account, JazzCash or Easypaisa). When the payout is by PayPal, PayPal's 10% charge is deducted from the publisher's payout. Payouts are reviewed and sent manually. You are responsible for the accuracy of your payout details; payments sent to wrong details cannot be recovered.

## 8. Rules
You may not use GPlinx for anything illegal, deceptive or harmful. This includes scams, malware, hate content, adult content, copyright infringement, fake or spam websites and misleading claims. Publisher websites must meet the listing requirements (for example DA and DR of at least 15, spam score of 10% or lower, at least 200 visits a month, at least 50 indexed pages, and a domain at least 2 months old). You may not share contact details in chat (they are hidden automatically), take deals outside the platform, abuse refunds or chargebacks, or create several accounts to cheat.

## 9. Disputes
If buyer and publisher disagree, contact us. We will review the order, the messages and the link in good faith and may release the payment, refund the buyer or keep the funds on hold. Our decision on how funds held on GPlinx are paid out is final.

## 10. Our responsibility
GPlinx is provided "as is". We are not responsible for search engine penalties, ranking changes, or the actions of users. To the extent the law allows, our total responsibility for any order is limited to the fees we received for that order.

## 11. Changes and contact
We may update these terms; the date on this page shows the latest version. Using GPlinx after a change means you accept it. These terms are governed by the laws of the country where GPlinx is operated.`,
privacy:`## What we collect
Account details (name, email, country, phone if you add it), your username, an optional profile picture, payout details you choose to save (such as a PayPal email or a USDT wallet address), the websites you list, your orders, messages and delivered links, payment slips you upload, payment records (amounts and transaction IDs), and basic technical data needed to keep the service secure.

## Why we use it
To run your account, process orders, hold and release payments, confirm top-ups, send payouts, prevent fraud, resolve disputes, send service emails (such as account confirmation and password reset), and meet legal and accounting duties. We do not sell your personal data and we do not show advertising.

## What other users can see
Buyers and publishers never see each other's names, usernames, pictures or contact details. Order chat runs on order numbers, and phone numbers, emails and links are hidden automatically. Buyers see a listed website's address, niche, price and quality figures, but not who owns it. Payment slips are stored privately: only you and the GPlinx administrators can open them. GPlinx administrators can read order messages to resolve disputes.

## Who helps us run the service
We use trusted providers: Supabase (database, login and file storage), GitHub (hosting of this website), and an email delivery service for service emails. When you pay by PayPal, USDT, bank transfer or a mobile wallet, the payment network handles the payment and we receive the transaction details. These providers process data only to provide their service to us.

## Cookies and browser storage
We do not use advertising or tracking cookies. Your browser stores a login session so you stay signed in; logging out removes it.

## How long we keep data
While your account is active, and afterwards as long as needed for accounting, fraud prevention and legal reasons.

## Security
The site uses an encrypted connection. Access to data is limited by account rules, and administrator actions are logged. No system is perfectly secure, so please use a strong, unique password.

## Your choices
You can ask to see, correct or delete your data by writing to us. We may keep records we are required to keep. GPlinx is not for people under 18.

## Changes
We may update this policy; the date on this page shows the latest version.`,
refunds:`## Orders
If the publisher rejects your order, or does not deliver within the promised time, you can take a full refund (the price, the service fee and any extra) to your GPlinx wallet, or choose to wait longer. After delivery you have 3 days to ask for improvements and 20 days to report a removed link or an article that is not indexed. If a problem is not fixed, contact us and we will review the order and may refund you.

## Completed orders
Once you approve an order, or the 20-day review period ends with no open problem, the payment is released to the publisher and the order is final.

## Wallet balance
Money added to your wallet is meant for orders on GPlinx. If you want unused balance returned, write to us and we will review the request.

## Payouts
If we reject a payout request, the amount returns to your wallet balance.

## How to ask
Write to us with your order number. Refunds to your wallet appear in your balance; we explain any other refund before sending it.`,
