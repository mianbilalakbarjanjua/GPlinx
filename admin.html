legal:{
terms:`## 1. What GPlinx is
GPlinx is an online marketplace where advertisers (buyers) order guest posts and links on websites owned by publishers. We provide the platform, hold payments in escrow and help resolve problems. We do not own the listed websites and we do not promise any ranking, traffic or search engine result.

## 2. Your account
You must be at least 18 years old and give true information. Keep your password safe: you are responsible for what happens in your account. Your username is created from your email and cannot be changed. We may suspend or close accounts that break these terms or put other users at risk.

## 3. Prices and fees
Publishers set their own prices in US dollars. The buyer pays the publisher's price plus a flat 20% service fee (and the extra price if the publisher writes the article). GPlinx takes no commission from publishers: the publisher receives the full listing price. A promo code can lower the buyer's service fee. We may change our fees; a change only applies to orders placed after it is announced.

## 4. Adding money to your wallet
You can add funds with the payment methods shown on the Add funds page (PayPal, USDT, Pakistani or international bank transfer, JazzCash, Easypaisa). Send the payment to the details shown there, enter the transaction or reference number, and upload a picture of your payment slip. The slip is required. Your wallet is credited after we confirm the payment. Always use the network shown for USDT: money sent on a different network or to a wrong address cannot be recovered. A transaction ID can be used only once. If a payment is reversed, cancelled or found to be fraudulent, we may remove the credit and suspend the account.

## 5. How an order works
When a buyer orders, the payment is held in escrow. The publisher accepts or rejects the order. If the publisher rejects it, or does not deliver in the promised time, the buyer gets a full refund to the wallet (or can choose to wait longer). The publisher publishes the article, which the buyer provides or the publisher writes, and sends the live link.

## 6. Improvements, review period and payment release
After delivery the buyer has 3 days to ask for improvements through the order messages. For 20 days the buyer can also report a removed link or an article that is not indexed by Google. The publisher must make sure the article is indexed within the 20 days. While a problem is open, the payment stays on hold; when the publisher fixes it, a new 20-day review period starts. If the buyer approves, or 20 days pass with no open problem, the publisher's payment is released automatically. Every order shows a live timer.

## 7. Publisher payouts
Publishers can withdraw their available balance (minimum $10) to the payout details saved in their settings (PayPal, USDT, bank account, JazzCash or Easypaisa). When the payout is by PayPal, PayPal's 10% charge is deducted from the publisher's payout. Payouts are reviewed and sent manually. You are responsible for the accuracy of your payout details; payments sent to wrong details cannot be recovered.

## 8. Rules
You may not use GPlinx for anything illegal, deceptive or harmful. This includes scams, malware, hate content, adult content, copyright infringement, fake or spam websites and misleading claims. Publisher websites must meet the listing requirements (for example DA and DR of at least 15, spam score of 10% or lower, at least 200 visits a month, at least 50 indexed pages, and a domain at least 2 months old). You may not share contact details in chat (they are hidden automatically), take deals outside the platform, abuse refunds or chargebacks, or create several accounts to cheat.

## 9. Disputes
If buyer and publisher disagree, contact us. We will review the order, the messages and the link in good faith and may release the payment, refund the buyer or keep the funds on hold. Our decision on how funds held on GPlinx are paid out is final.

## 10. Our responsibility
GPlinx is provided "as is". We are not responsible for search engine penalties, ranking changes, or the actions of users. To the extent the law allows, our total responsibility for any order is limited to the fees we received for that order.

## 11. Changes and contact
We may update these terms; the date on this page shows the latest version. Using GPlinx after a change means you accept it. These terms are governed by the laws of the country where GPlinx is operated.`,
privacy:`## What we collect
Account details (name, email, country, phone if you add it), your username, an optional profile picture, payout details you choose to save (such as a PayPal email or a USDT wallet address), the websites you list, your orders, messages and delivered links, payment slips you upload, payment records (amounts and transaction IDs), and basic technical data needed to keep the service secure.

## Why we use it
To run your account, process orders, hold and release payments, confirm top-ups, send payouts, prevent fraud, resolve disputes, send service emails (such as account confirmation and password reset), and meet legal and accounting duties. We do not sell your personal data and we do not show advertising.

## What other users can see
Buyers and publishers never see each other's names, usernames, pictures or contact details. Order chat runs on order numbers, and phone numbers, emails and links are hidden automatically. Buyers see a listed website's address, niche, price and quality figures, but not who owns it. Payment slips are stored privately: only you and the GPlinx administrators can open them. GPlinx administrators can read order messages to resolve disputes.

## Who helps us run the service
We use trusted providers: Supabase (database, login and file storage), GitHub (hosting of this website), and an email delivery service for service emails. When you pay by PayPal, USDT, bank transfer or a mobile wallet, the payment network handles the payment and we receive the transaction details. These providers process data only to provide their service to us.

## Cookies and browser storage
We do not use advertising or tracking cookies. Your browser stores a login session so you stay signed in; logging out removes it.

## How long we keep data
While your account is active, and afterwards as long as needed for accounting, fraud prevention and legal reasons.

## Security
The site uses an encrypted connection. Access to data is limited by account rules, and administrator actions are logged. No system is perfectly secure, so please use a strong, unique password.

## Your choices
You can ask to see, correct or delete your data by writing to us. We may keep records we are required to keep. GPlinx is not for people under 18.

## Changes
We may update this policy; the date on this page shows the latest version.`,
refunds:`## Orders
If the publisher rejects your order, or does not deliver within the promised time, you can take a full refund (the price, the service fee and any extra) to your GPlinx wallet, or choose to wait longer. After delivery you have 3 days to ask for improvements and 20 days to report a removed link or an article that is not indexed. If a problem is not fixed, contact us and we will review the order and may refund you.

## Completed orders
Once you approve an order, or the 20-day review period ends with no open problem, the payment is released to the publisher and the order is final.

## Wallet balance
Money added to your wallet is meant for orders on GPlinx. If you want unused balance returned, write to us and we will review the request.

## Payouts
If we reject a payout request, the amount returns to your wallet balance.

## How to ask
Write to us with your order number. Refunds to your wallet appear in your balance; we explain any other refund before sending it.`,
updated:'26 November 2026'}

async function gate(){try{const a=await sb.auth.mfa.getAuthenticatorAssuranceLevel();if(a.data&&a.data.currentLevel==='aal1'&&a.data.nextLevel==='aal2'){view='mfa';render();return}mfaOn=!!(a.data&&a.data.currentLevel==='aal2')}catch(x){}
 const r=await sb.rpc('is_admin');if(r.error||r.data!==true){view='denied';render();return}view='app';await loadContent();await load()}
async function doLogin(){const e=$('lg_e').value.trim(),p=$('lg_p').value;loginErr='';if(!e||!p){loginErr='Enter your email and password.';render();return}
 const r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error){loginErr='Wrong email or password.';render();return}adminEmail=e;await gate()}
async function doMfa(){const code=$('mf_c').value.trim();loginErr='';
 try{const f=await sb.auth.mfa.listFactors(),fac=f.data&&f.data.totp&&f.data.totp[0];if(!fac){loginErr='No authenticator found for this account.';render();return}
  const ch=await sb.auth.mfa.challenge({factorId:fac.id});if(ch.error){loginErr=ch.error.message;render();return}
  const v=await sb.auth.mfa.verify({factorId:fac.id,challengeId:ch.data.id,code});if(v.error){loginErr='That code is wrong or expired. Try the new code.';render();return}await gate()}catch(x){loginErr='Could not verify the code. Try again.';render()}}
async function doLogout(){try{await sb.auth.signOut()}catch(x){}view='login';data=null;ov=null;detail=null;render()}
async function loadContent(){try{const r=await sb.from('site_content').select('key,value');const o={};(r.data||[]).forEach(x=>o[x.key]=x.value);AC=merge(window.GP_DEFAULTS,o)}catch(e){}W=clone(AC)}

 else if(tab==='payouts')data=await rpc('admin_list_payouts',{p_status:filt.payouts});else if(tab==='orders')data=await rpc('admin_list_orders',{p_filter:filt.orders});
 else if(tab==='users')data=await rpc('admin_list_users',{p_q:qs.users});else if(tab==='ledger')data=await rpc('admin_list_ledger',{p_q:qs.ledger});
 else if(tab==='promos')data=await rpc('admin_list_promos');else if(tab==='log')data=await rpc('admin_list_log');

function secV(id){const s=SEC[id],base=s.root?s.root:s.legal?'legal':'home.'+id;let h=`<div class="card"><h3>${s.t}</h3>`;
 if(s.legal)return h+`<textarea data-p="legal.${id}" data-t="a" rows="22">${E(W.legal[id]||'')}</textarea><p class="m sm">Use “## Heading” for headings, a blank line between paragraphs, and “- ” for bullet points. “Last updated” is under Site settings below.</p></div>`;
 if(s.arr){const a=list(getP(W,base));h+=a.map((x,i)=>`<div class="li">${s.lf.map(f=>fld(base+'.'+i+'.'+f[0],f[1],f[2],x[f[0]])).join('')}<div class="row" style="margin-top:8px">${btn('Remove','ldel',`data-p="${base}" data-i="${i}"`,'r')}</div></div>`).join('')+`<button class="btn s g" data-do="ladd" data-p="${base}" data-s="${id}">+ Add</button>`;return h+'</div>'}
 h+=(s.f||[]).map(f=>fld(base+'.'+f[0],f[1],f[2],getP(W,base+'.'+f[0]))).join('');
 if(s.list){const lp=base+'.'+s.list,a=list(getP(W,lp));h+=`<div class="sect"><b>List items</b></div>`+a.map((x,i)=>`<div class="li">${s.lf.map(f=>fld(lp+'.'+i+'.'+f[0],f[1],f[2],x[f[0]])).join('')}<div class="row" style="margin-top:8px">${btn('Remove','ldel',`data-p="${lp}" data-i="${i}"`,'r')}</div></div>`).join('')+`<button class="btn s g" data-do="ladd" data-p="${lp}" data-s="${id}">+ Add item</button>`}
 return h+'</div>'}
function vContent(){const g=GR;const names={home:'Home page',pages:'Legal pages',rules:'Publisher rules',site:'Site and contact'};
 const ids=g[cgrp];return `<h2>Content</h2><p class="m">Everything customers read can be changed here. Press “Save” after editing a group. Changes appear on the website within a minute (refresh the website page).</p><div class="row">${Object.keys(names).map(k=>`<button class="btn s ${cgrp===k?'':'g'}" data-do="cgrp" data-v="${k}">${names[k]}</button>`).join('')}</div>
 ${ids.map(secV).join('')}${cgrp==='pages'?`<div class="card"><label>“Last updated” date shown on legal pages</label><input data-p="legal.updated" value="${E(W.legal.updated||'')}"></div>`:''}<div class="row"><button class="btn" data-do="csave">Save ${names[cgrp]}</button><button class="btn g" data-do="creset">Undo my unsaved changes</button></div>`}
function imgF(k,l){const v=W.design[k]||'';return `<div class="li"><b>${l}</b><img class="pv" src="${E(v)}" alt="" onerror="this.style.opacity=.3"><label>Image address</label><input class="full" data-p="design.${k}" value="${E(v)}"><div class="row" style="margin-top:8px"><input type="file" accept="image/jpeg,image/png,image/webp,image/svg+xml" data-up="${k}"><span class="m sm">JPG, PNG, WEBP or SVG, up to 3 MB. It uploads at once.</span></div></div>`}
function vLook(){const d=W.design,col=(k,l)=>`<div><label>${l}</label><input type="color" data-p="design.${k}" value="${E(d[k]||'#000000')}"></div>`;
 return `<h2>Appearance</h2><p class="m">Colors, fonts, logo and pictures. Press “Save appearance” to publish the changes.</p>
 <div class="card"><h3>Colors</h3><div class="row">${col('primary','Main orange')}${col('primaryDark','Darker orange')}${col('dark','Dark (header, hero)')}${col('cream','Cream')}${col('offwhite','Page background')}${col('text','Text')}${col('muted','Soft text')}</div></div>
 <div class="card"><h3>Style</h3><div class="row"><div><label>Font</label><select data-p="design.font">${['Inter','Poppins','Plus Jakarta Sans','System'].map(f=>`<option ${d.font===f?'selected':''}>${f}</option>`).join('')}</select></div><div><label>Corner roundness of cards (px)</label><input type="number" min="0" max="40" data-p="design.radius" data-n="1" value="${E(d.radius)}" style="width:110px"></div><div><label>Dark overlay on the hero picture (%)</label><input type="number" min="0" max="100" data-p="design.heroOverlay" data-n="1" value="${E(d.heroOverlay)}" style="width:110px"></div><div><label>Hero height on computers (px)</label><input type="number" min="420" max="900" data-p="design.heroHeight" data-n="1" value="${E(d.heroHeight)}" style="width:110px"></div></div></div>
 <div class="card"><h3>Logo</h3><label>Logo text</label><input class="full" data-p="design.logoText" value="${E(d.logoText||'')}" style="max-width:300px"><p class="m sm">The first two letters are dark and the rest orange (GPlinx → GP + linx). Upload a picture only if you want your own logo image instead of the built-in mark.</p>${imgF('logoUrl','Logo picture (optional, square works best)')}</div>
 <div class="card"><h3>Hero pictures</h3>${imgF('heroDesktop','Hero picture for computers (wide)')}${imgF('heroMobile','Hero picture for phones (tall)')}<label>Picture description (for search engines and screen readers)</label><input class="full" data-p="design.heroAlt" value="${E(d.heroAlt||'')}"></div>
 <div class="card"><h3>Feature section pictures</h3>${imgF('featureDesktop','Feature picture for computers')}${imgF('featureMobile','Feature picture for phones')}<label>Picture description</label><input class="full" data-p="design.featureAlt" value="${E(d.featureAlt||'')}"></div>
 <div class="row"><button class="btn" data-do="lsave">Save appearance</button><button class="btn g" data-do="creset">Undo my unsaved changes</button></div>`}
function vSettings(){const s=settingsData||{};const f=(k,l,ph)=>`<label>${l}</label><input id="st_${k}" class="full" style="max-width:560px" placeholder="${ph}" value="${E(s[k]||'')}">`,ta=(k,l,ph)=>`<label>${l}</label><textarea id="st_${k}" rows="4" style="max-width:560px" placeholder="${ph}">${E(s[k]||'')}</textarea>`;
 return `<h2>Settings</h2><div class="card"><h3>Where customers send their money</h3><p class="m sm">These details are shown on the Add funds page in large bold letters. A method with an empty box is shown as “not available yet”. Check every character twice.</p>
 <h3 style="margin-top:14px">PayPal and USDT</h3>${f('paypal_email','PayPal email','you@example.com')}${f('usdt_address','USDT wallet address','Your wallet address')}${f('usdt_network','USDT network (must match your wallet)','TRC20')}
 <h3 style="margin-top:14px">Bank accounts, JazzCash and Easypaisa</h3>${ta('bank_pk_details','Pakistani bank account (shown as written)','Bank name\nAccount title\nAccount number\nIBAN')}${ta('bank_intl_details','International bank account (USD)','Bank name\nAccount holder\nIBAN / account number\nSWIFT / BIC')}${ta('jazzcash_details','JazzCash account','Account title\nMobile number')}${ta('easypaisa_details','Easypaisa account','Account title\nMobile number')}
 ${f('pkr_rate','Rupee rate: how many PKR for 1 USD','Example: 280')}${ta('payment_note','Note shown to customers on the Add funds page (optional)','Example: Payments are confirmed within a few hours.')}<div class="row" style="margin-top:14px"><button class="btn" data-do="saveset">Save settings</button></div></div>
 <div class="card"><h3>Two-step verification (strongly recommended)</h3>${mfaOn?'<p>'+pill('On','ok')+' This admin account needs a code from your authenticator app at every login.</p>':enrollInfo?`<p>1) Open an authenticator app and scan this code, or type the key.</p><p><img alt="QR code" src="${E(enrollInfo.qr)}" width="180" height="180"></p><p class="mono sm">${E(enrollInfo.secret)}</p><p>2) Type the 6-digit code:</p><div class="row"><input id="en_c" inputmode="numeric" maxlength="6" placeholder="123456"><button class="btn s" data-do="enrollok">Turn on</button></div>`:'<p>'+pill('Off','er')+' Anyone with your password could control all the money. Turn this on now.</p><button class="btn" data-do="enroll">Set up two-step verification</button>'}</div>`}
function render(){const r=$('root');if(view==='boot')return;
 if(view==='login'){r.innerHTML=`<div class="auth"><div class="card"><h2>GPlinx Admin</h2><p class="m sm">Administrators only.</p><label>Email</label><input id="lg_e" type="email" class="full" autocomplete="username"><label>Password</label><input id="lg_p" type="password" class="full" autocomplete="current-password"><p style="color:var(--rd)">${E(loginErr)}</p><button class="btn full" data-do="login">Log in</button></div></div>`;return}
 if(view==='mfa'){r.innerHTML=`<div class="auth"><div class="card"><h2>Two-step verification</h2><p class="m sm">Type the 6-digit code from your authenticator app.</p><input id="mf_c" inputmode="numeric" maxlength="6" class="full" style="font-size:22px;letter-spacing:.3em;text-align:center" placeholder="123456" autocomplete="one-time-code"><p style="color:var(--rd)">${E(loginErr)}</p><button class="btn full" data-do="mfago">Verify</button><p><button class="btn g s" data-do="logout">Cancel</button></p></div></div>`;return}
 if(view==='denied'){r.innerHTML=`<div class="auth"><div class="card"><h2>No access</h2><p>This account is not an administrator.</p><button class="btn" data-do="logout">Log out</button></div></div>`;return}
 const bd=k=>{if(!ov)return '';const n={sites:ov.sites_pending,topups:ov.topups_pending,payouts:ov.payouts_pending,orders:ov.issues_open}[k];return n>0?`<span class="badge">${n}</span>`:''};
 let body;if(busy&&data===null&&!['ov','content','look','settings'].includes(tab))body='<div class="card m">Loading…</div>';else body={ov:vOv,sites:vSites,topups:vTopups,payouts:vPayouts,orders:vOrders,users:vUsers,ledger:vLedger,promos:vPromos,content:vContent,look:vLook,settings:vSettings,log:vLog}[tab]();
 r.innerHTML=`<div class="top"><b>GP<span>linx</span> Admin</b><span><small>${E(adminEmail)}</small> &nbsp; <a class="btn s g" href="index.html" target="_blank" rel="noopener">View website</a> <button class="btn s g" data-do="refresh">Refresh</button> <button class="btn s g" data-do="logout">Log out</button></span></div><div class="wrap"><div class="side">${TABS.map(t=>`<button class="${tab===t[0]?'on':''}" data-do="tab" data-v="${t[0]}">${t[1]}${bd(t[0])}</button>`).join('')}</div><div>${body}</div></div>`}
/* ---------- clicks ---------- */
const DO={login:doLogin,mfago:doMfa,logout:doLogout,refresh:()=>load(),
 tab:d=>{tab=d.v;detail=null;if(d.f)filt.orders=d.f;if(tab==='content'||tab==='look')W=clone(AC);load()},back:()=>{detail=null;render()},search:d=>{qs[d.t]=$('q_'+d.t).value.trim();load()},
 siterev:d=>{if(d.v==='1')return act('admin_review_site',{p_id:d.id,p_approved:true,p_reason:null},'Website approved. It is now live.');const r=prompt('Reason for the publisher (they will see it):','');if(r===null)return;act('admin_review_site',{p_id:d.id,p_approved:false,p_reason:r},'Website not approved. The publisher was told the reason.')},
 feat:d=>act('admin_set_featured',{p_id:d.id,p_flag:d.v==='1'},d.v==='1'?'The website now shows on the homepage (name hidden).':'Removed from the homepage.'),
 sitedel:d=>act('admin_delete_site',{p_id:d.id},'Website deleted.','Delete '+d.n+' permanently? Existing orders are kept.'),
 siteedit:d=>{const s=list(data).find(x=>x.id===d.i);if(!s)return;const a=[['price','Price in USD',s.price],['dr','DR',s.dr],['da','DA',s.da],['traffic','Monthly traffic',s.traffic],['delivery_hours','Delivery time in hours',s.delivery_hours],['niche','Niche',s.niche],['country','Country',s.country]],p={};for(const x of a){const v=prompt(x[1]+' for '+s.domain,x[2]==null?'':x[2]);if(v===null)return;p[x[0]]=String(v).trim()}act('admin_edit_site',{p_id:s.id,p},'Website updated.')},
 topup:d=>act('admin_topup_decide',{p_id:+d.id,p_approve:d.v==='1'},d.v==='1'?'Top-up confirmed and credited.':'Top-up rejected.',d.v==='1'?`Confirm that you received $${d.a} from ${d.e}? It will be added to their wallet now.`:`Reject this top-up of $${d.a}?`),
 slip:async d=>{const w=window.open('','_blank');try{const r=await sb.storage.from('slips').createSignedUrl(d.p,300);if(r.error||!r.data){if(w)w.close();toast('Could not open the slip: '+(r.error?r.error.message:'unknown error'),true);return}if(w)w.location.href=r.data.signedUrl;else window.location.href=r.data.signedUrl}catch(x){if(w)w.close();toast('Could not open the slip.',true)}},
 payout:d=>act('admin_payout_decide',{p_id:+d.id,p_paid:d.v==='1'},d.v==='1'?'Marked as paid.':'Payout rejected and returned to the wallet.',d.v==='1'?`Press OK only if you already sent $${d.a}.`:`Reject this payout and return $${d.a} to the publisher's wallet?`),
 order:async d=>{const r=await rpc('admin_order_detail',{p_id:+d.id});if(r&&r!==true){detail=r;render()}},
 release:d=>act('admin_release_order',{p_id:+d.id},'Payment released to the publisher.','Release the payment to the publisher now?'),refund:d=>act('admin_refund_order',{p_id:+d.id},'Order cancelled and the buyer was refunded.','Cancel this order and refund the buyer in full?'),
 adj:d=>{const a=prompt('Amount to add (use a minus sign to remove) for '+d.e+':','');if(a===null||a==='')return;const n=prompt('Reason (shown to the user and saved in the log):','');if(n===null)return;act('admin_adjust_balance',{p_user:d.id,p_amount:+a,p_note:n},'Balance adjusted.',`Change ${d.e}'s wallet by $${+a}?`)},
 role:d=>{const r=prompt('New role for '+d.e+' (buyer, seller or admin). Current: '+d.r,d.r);if(r===null)return;act('admin_set_role',{p_user:d.id,p_role:r.trim().toLowerCase()},'Role changed.',`Change ${d.e} to ${r}?`)},
 susp:d=>act('admin_set_suspended',{p_user:d.id,p_flag:d.v==='1'},d.v==='1'?'Account suspended.':'Account reactivated.',d.v==='1'?`Suspend ${d.e}? They will not be able to order, top up, withdraw or list websites.`:null),
 promosave:()=>{const c=$('pc_c').value.trim(),p=+$('pc_p').value,m=$('pc_m').value,x=$('pc_x').value;act('admin_save_promo',{p_code:c,p_percent:p,p_active:true,p_max_uses:m?+m:null,p_expires:x?new Date(x+'T23:59:59').toISOString():null},'Promo code saved.')},
 promotog:d=>act('admin_save_promo',{p_code:d.c,p_percent:+d.p,p_active:d.a==='1',p_max_uses:d.m?+d.m:null,p_expires:d.x||null},'Promo code updated.'),promodel:d=>act('admin_delete_promo',{p_code:d.c},'Promo code deleted.','Delete the code '+d.c+'?'),
 saveset:async()=>{const cl=$('st_pkr_rate').value.trim();if(cl&&!(Number(cl)>0)){toast('The rupee rate must be a number, for example 280',true);return}let ok=true;for(const k of KEYS){const r=await rpc('admin_set_setting',{p_key:k,p_value:$('st_'+k).value.trim()});if(r===null){ok=false;break}}if(ok){toast('Settings saved.');await load()}},
 cgrp:d=>{cgrp=d.v;render()},creset:()=>{W=clone(AC);toast('Unsaved changes undone.');render()},
 ladd:d=>{const a=list(getP(W,d.p)).slice(),b=SEC[d.s].blank||{};a.push(clone(b));setP(W,d.p,a);render()},ldel:d=>{const a=list(getP(W,d.p)).slice();a.splice(+d.i,1);setP(W,d.p,a);render()},
 csave:async()=>{const keys={home:['home'],pages:['legal'],rules:['home'],site:['site']}[cgrp];for(const k of keys){const r=await rpc('admin_set_content',{p_key:k,p_value:W[k]});if(r===null)return}AC=clone(W);toast('Saved. Refresh the website to see it.')},
 lsave:async()=>{const r=await rpc('admin_set_content',{p_key:'design',p_value:W.design});if(r!==null){AC=clone(W);toast('Appearance saved. Refresh the website to see it.')}},
 enroll:async()=>{try{const r=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'GPlinx admin '+Date.now()});if(r.error){toast(r.error.message,true);return}enrollInfo={id:r.data.id,qr:r.data.totp.qr_code,secret:r.data.totp.secret};render()}catch(x){toast('Could not start the setup.',true)}},
 enrollok:async()=>{const code=$('en_c').value.trim();if(!enrollInfo)return;try{const r=await sb.auth.mfa.challengeAndVerify({factorId:enrollInfo.id,code});if(r.error){toast('Wrong code. Try again.',true);return}enrollInfo=null;mfaOn=true;toast('Two-step verification is now on.');render()}catch(x){toast('Could not verify the code.',true)}}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-do]');if(!b)return;e.preventDefault();const f=DO[b.dataset.do];if(f)f(b.dataset)});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset||{};
 if(d.filter){filt[d.filter]=t.value;load();return}
 if(d.up){const f=t.files[0];if(!f)return;if(f.size>3145728){toast('The picture is larger than 3 MB.',true);return}const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,''),name=d.up+'-'+Date.now()+'.'+ext;
  sb.storage.from('site-assets').upload(name,f,{contentType:f.type,upsert:true}).then(r=>{if(r.error){toast('Upload failed: '+r.error.message,true);return}const u=sb.storage.from('site-assets').getPublicUrl(name).data.publicUrl;setP(W,'design.'+d.up,u);toast('Picture uploaded. Press “Save appearance” to publish it.');render()})}});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset||{};if(!d.p)return;let v=t.value;if(d.t==='l')v=v.split('\n').map(x=>x.trim()).filter(Boolean);else if(d.n)v=Number(v);setP(W,d.p,v)});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id;if(id==='lg_e'||id==='lg_p')doLogin();else if(id==='mf_c')doMfa();else if(id==='q_users')DO.search({t:'users'});else if(id==='q_ledger')DO.search({t:'ledger'})});
start();

</script></body></html>
